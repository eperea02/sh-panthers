name: Sync game schedule

on:
  schedule:
    - cron: "17 */3 * * *"   # every 3 hours
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-schedule
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build schedule.json from TeamLinkt feed
        env:
          TEAMLINKT_ICS_URL: ${{ secrets.TEAMLINKT_ICS_URL }}
        run: python3 scripts/sync_schedule.py "$TEAMLINKT_ICS_URL" schedule.json
      - name: Commit if changed
        run: |
          if git diff --quiet -- schedule.json; then
            echo "No changes"
          else
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add schedule.json
            git commit -m "Update game schedule from TeamLinkt"
            git push
          fi
